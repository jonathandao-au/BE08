<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Student</title>
</head>
<body>
<h1>Student List</h1>
<div id="names"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const cls = urlParams.get('class');

if (!cls) {
    document.getElementById("names").innerHTML = "No class selected";
} else if (cls.toLowerCase() === "be8") {
    document.getElementById("names").innerHTML = "Phu, Hoan, Tan";
} else if (cls.toLowerCase() === "be7") {
    document.getElementById("names").innerHTML = "Uyen, Long, Quan";
} else {
    document.getElementById("names").innerHTML = "Unknown class";
}
</script>
</body>
</html>
